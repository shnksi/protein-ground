[project]
name = "proteinground"
dynamic = ["version"]
description = "Cited protein facts for AI agents: an MCP server over UniProt, RCSB PDB and AlphaFold DB, with an eval that plants false-premise questions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "proteins", "uniprot", "pdb", "alphafold", "bioinformatics", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
eval = ["anthropic>=2.12,<3"]

[project.scripts]
proteinground = "proteinground.server:main"
proteinground-mcp = "proteinground.server:main"
proteinground-eval = "proteinground.eval.cli:main"

[project.urls]
Homepage = "https://github.com/shnksi/protein-ground"
Repository = "https://github.com/shnksi/protein-ground"
Issues = "https://github.com/shnksi/protein-ground/issues"
Changelog = "https://github.com/shnksi/protein-ground/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/proteinground/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proteinground"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Dashes and the angstrom sign are parsed on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "evals"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
