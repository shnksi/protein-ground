[project]
name = "proteinground"
version = "0.1.0"
description = "Cited protein facts for AI agents: an MCP server over UniProt, RCSB PDB and AlphaFold DB, with an eval that plants false-premise questions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
eval = ["anthropic>=2.12,<3"]

[project.scripts]
proteinground-mcp = "proteinground.server:main"
proteinground-eval = "proteinground.eval.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteinground"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Dashes and the angstrom sign are parsed on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "evals"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
